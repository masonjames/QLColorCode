name: Compatibility report
description: Test the downloaded beta or a source build on your Mac. No Xcode needed for beta reports.
title: "[Compatibility] "
body:
  - type: input
    id: platform
    attributes:
      label: macOS version/build and chip
      description: Use the exact version and say Apple Silicon or Intel.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Release version and installation method, or source build
      description: For downloads, give the release tag, app build and DMG or Homebrew. For source builds, give the commit, Xcode and signing setup. No private paths or credentials.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: What did you actually test?
      description: Follow docs/COMPATIBILITY.md. Separate companion rendering, Finder invocation, keyboard/VoiceOver and installation results. Name file extensions and failures. Mark each untested item as not tested.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or minimal reproduction
      description: Use public/synthetic source and app-only screenshots. Remove personal paths and unrelated desktop content.
