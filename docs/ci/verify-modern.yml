name: Verify modern development app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check renderer and legacy regression
        run: bash scripts/test-modern.sh
      - name: Check WebKit wrapping and source selection
        run: bash scripts/test-preview-layout.sh
      - name: Build universal app from checked-in project
        run: >-
          xcodebuild -project modern/QLColorCodeModern.xcodeproj
          -scheme QLColorCode -configuration Debug -derivedDataPath build/modern
          ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO build
      - name: Inspect embedded extension and signatures
        run: python3 scripts/verify-bundle.py
